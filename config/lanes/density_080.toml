# Density sweep: 80/120 pedestrians per square metre; paper force parameters unchanged.
[run]
name = "lanes-n080"
seed = 20261116
duration_s = 180.0
time_step_s = 0.01

[scenario]
type = "bidirectional"
direction_mode = "fixed_vector"

[domain]
width_m = 20.0
height_m = 6.0
boundary_x = "periodic"

[agents]
count = 80
initial_placement = "uniform"
initial_minimum_separation_m = 0.4
desired_speed_mean_m_per_s = 1.34
desired_speed_stddev_m_per_s = 0.26
relaxation_time_s = 0.5
maximum_speed_factor = 1.3

[output]
trajectory_interval_s = 0.5
render_interval_s = 0.5
directory = "results/lanes-n080"

