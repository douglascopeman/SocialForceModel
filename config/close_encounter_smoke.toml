# Same microscopic settings and seed as unidirectional_periodic.toml.
# Separate outputs preserve the earlier pre-fix run for comparison.
[run]
name = "close-encounter-smoke"
seed = 20261116
duration_s = 60.0
time_step_s = 0.002

[scenario]
type = "unidirectional"
direction_mode = "fixed_vector"

[domain]
width_m = 20.0
height_m = 10.0
boundary_x = "periodic"
boundary_y = "periodic"

[agents]
count = 80
initial_placement = "uniform"
initial_minimum_separation_m = 0.4
desired_speed_mean_m_per_s = 1.34
desired_speed_stddev_m_per_s = 0.26
relaxation_time_s = 0.5
maximum_speed_factor = 1.3

[output]
trajectory_interval_s = 0.5
render_interval_s = 5.0
directory = "results/close-encounter-smoke"
