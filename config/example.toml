[run]
name = "free-flow-smoke"
seed = 20261116
duration_s = 30.0
time_step_s = 0.01

[domain]
width_m = 12.0
height_m = 4.0
boundary = "open_channel"

[agents]
count = 50
desired_speed_m_per_s = 1.3
relaxation_time_s = 0.5

[output]
trajectory_interval_s = 0.1
directory = "results/free-flow-smoke"

[coarse_graining]
enabled = false
fields = ["density", "velocity", "polarisation"]
grid_spacing_m = 0.25
kernel = "gaussian"
kernel_width_m = 0.5
kernel_cutoff_sigma = 3.0
window_s = 1.0
boundary_policy = "renormalize"

[admissibility]
minimum_effective_samples = 20
replicates = 8
