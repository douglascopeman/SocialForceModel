# Values transcribed from Helbing & Molnar, supplied PDF, equations (1)-(13), pp. 3-8.
# This is a parameter reference, not yet a fully specified scenario.

[model]
variant = "helbing_molnar_preferred_velocity"
attraction_enabled = false
fluctuations_enabled = false

[agents]
desired_speed_distribution = "normal"
desired_speed_mean_m_per_s = 1.34
desired_speed_stddev_m_per_s = 0.26
relaxation_time_s = 0.5
maximum_speed_factor = 1.3

[interactions]
pair_potential = "exponential_elliptical"
pair_potential_amplitude_m2_per_s2 = 2.1
pair_range_m = 0.3
anticipation_time_s = 2.0
wall_potential = "exponential"
wall_potential_amplitude_m2_per_s2 = 10.0
wall_range_m = 0.2
field_of_view_angle_deg = 200.0
rear_influence_weight = 0.5

[domain]
walkway_width_m = 10.0
