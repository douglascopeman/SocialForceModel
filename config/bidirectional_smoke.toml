[run]
name = "bidirectional-smoke"
seed = 20261116
duration_s = 8.0
time_step_s = 0.01

[scenario]
type = "bidirectional"

[domain]
width_m = 20.0
height_m = 6.0
open_x = true

[agents]
count = 40
desired_speed_mean_m_per_s = 1.34
desired_speed_stddev_m_per_s = 0.26
relaxation_time_s = 0.5
maximum_speed_factor = 1.3

[interactions]
pair_potential_amplitude_m2_per_s2 = 2.1
pair_range_m = 0.3
anticipation_time_s = 2.0
wall_potential_amplitude_m2_per_s2 = 10.0
wall_range_m = 0.2
field_of_view_angle_deg = 200.0
rear_influence_weight = 0.5

[output]
trajectory_interval_s = 0.1
render_interval_s = 2.0
directory = "results/bidirectional-smoke"
