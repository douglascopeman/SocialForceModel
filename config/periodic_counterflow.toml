# A 60 s run at constant average number density 40/(20*6) = 1/3 m^-2.
[run]
name = "periodic-counterflow"
seed = 20261116
duration_s = 60.0
time_step_s = 0.01

[scenario]
type = "bidirectional"
direction_mode = "fixed_vector"

[domain]
width_m = 20.0
height_m = 6.0
boundary_x = "periodic"

[agents]
count = 40
desired_speed_mean_m_per_s = 1.34
desired_speed_stddev_m_per_s = 0.26
relaxation_time_s = 0.5
maximum_speed_factor = 1.3

[output]
trajectory_interval_s = 0.2
render_interval_s = 0.2
directory = "results/periodic-counterflow"
